[project]
name = "mental_health-kg"
version = "0.1.0"
description = "Mental Health knowledge graph built on Samyama — US behavioural-health facilities, services, languages and referral routing"
requires-python = ">=3.10"
dependencies = [
    # samyama ships samyama_mcp and declares fastmcp>=2.0 and pyyaml>=6.0. Both
    # are used by mcp_server but neither is imported directly here, so neither is
    # restated -- an earlier fastmcp>=0.1.0 pin here was looser than samyama's own
    # and could have resolved to a version samyama_mcp cannot use.
    "samyama>=0.6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["etl*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
